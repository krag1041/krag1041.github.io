<head>
  <meta charset="UTF-8">

  <style>
    /* =========================
       Base
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f7f8;
      color: #17191c;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    a {
      color: inherit;
    }


    /* =========================
       Header
    ========================= */

    header {
      padding: 42px 20px 28px;

      background: #ffffff;
      border-bottom: 1px solid #e8e9eb;
    }

    .header-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 8px;

      color: #7b8087;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .description {
      margin: 10px 0 0;

      color: #777c83;
      font-size: 14px;
      line-height: 1.7;
    }


    /* =========================
       Main
    ========================= */

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }


    /* =========================
       Section
    ========================= */

    .section {
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 9px;

      margin: 0 4px 12px;

      color: #8a8f96;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .section-header .badge {
      display: inline-block;

      padding: 4px 7px;

      border-radius: 5px;

      background: #FF7F7F;
      color: #ffffff;

      font-size: 9px;
      letter-spacing: 0.08em;
    }


    /* =========================
       Video List
    ========================= */

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }


    /* =========================
       Video Card
    ========================= */

    .video-card {
      padding: 18px;

      background: #ffffff;
      border: 1px solid #e7e8ea;
      border-radius: 14px;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .video-card:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .video-title {
      margin: 0 0 8px;

      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
    }

    .video-note {
      margin: 0 0 16px;

      color: #777c83;
      font-size: 13px;
      line-height: 1.7;
    }

    .video-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      padding: 9px 13px;

      border-radius: 8px;

      background: #17191c;
      color: #ffffff;

      font-size: 12px;
      font-weight: 700;
      text-decoration: none;

      transition:
        background 0.15s ease;
    }

    .video-link:hover {
      background: #33373c;
    }

    .play-icon {
      font-size: 10px;
    }


    /* =========================
       NEW Section
    ========================= */

    .new-section {
      margin-bottom: 44px;
    }

    .new-section .video-card {
      border-color: #d8dce1;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .new-section .video-card + .video-card {
      margin-top: 10px;
    }


    /* =========================
       Archive
    ========================= */

    .archive-section {
      padding-top: 4px;
    }

    .archive-section .section-header {
      padding-top: 4px;
    }

    .archive-section .video-list {
      gap: 10px;
    }


    /* =========================
       Empty
    ========================= */

    .empty {
      padding: 45px 20px;

      color: #999da3;

      text-align: center;
      font-size: 13px;
    }


    /* =========================
       Footer
    ========================= */

    footer {
      padding: 30px 20px 40px;

      color: #a0a4aa;

      text-align: center;
      font-size: 11px;
    }


    /* =========================
       Mobile
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 34px 18px 24px;
      }

      h1 {
        font-size: 24px;
      }

      main {
        padding: 22px 12px 50px;
      }

      .video-card {
        padding: 16px;
        border-radius: 12px;
      }

      .video-title {
        font-size: 15px;
      }

      .video-link {
        width: 100%;
        padding: 11px;
      }
    }
  </style>

    /*
     * ==================================================
     * HTMLエスケープ
     * ==================================================
     */

    function escapeHTML(str) {

      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }



    /*
     * ==================================================
     * 動画カードを作る
     * ==================================================
     */

    function createVideoCard(video) {

      const card = document.createElement("article");

      card.className = "video-card";

      card.innerHTML = `

        <h2 class="video-title">
          ${escapeHTML(video.title)}
        </h2>

        <p class="video-note">
          ${escapeHTML(video.note)}
        </p>

        <a
          class="video-link"
          href="${escapeHTML(video.url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="play-icon">▶</span>
          YouTubeで見る
        </a>

      `;

      return card;

    }



    /*
     * ==================================================
     * NEW リスト
     * ==================================================
     *
     * new: true のものだけを抜き出します。
     *
     * 元の videos の順番は変更しません。
     *
     */

    const newVideos =
      videos.filter(video => video.new === true);



    /*
     * ==================================================
     * NEW を表示
     * ==================================================
     */

    const newVideoList =
      document.getElementById("newVideoList");

    const newSection =
      document.getElementById("newSection");


    if (newVideos.length === 0) {

      /*
       * NEWが0件なら、
       * NEWセクション自体を非表示にします。
       */

      newSection.style.display = "none";

    } else {

      newVideos.forEach(video => {

        newVideoList.appendChild(
          createVideoCard(video)
        );

      });

    }



    /*
     * ==================================================
     * 全リストを表示
     * ==================================================
     *
     * こちらは videos の順番を
     * そのまま維持します。
     *
     */

    const videoList =
      document.getElementById("videoList");


    if (videos.length === 0) {

      videoList.innerHTML = `
        <div class="empty">
          動画はまだありません。
        </div>
      `;

    } else {

      videos.forEach(video => {

        videoList.appendChild(
          createVideoCard(video)
        );

      });

    }

  </script>
