<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Football Video Archive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f7f8;
      color: #17191c;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    a {
      color: inherit;
    }

    /* --------------------
       Header
    -------------------- */

    header {
      padding: 42px 20px 28px;
      background: #ffffff;
      border-bottom: 1px solid #e8e9eb;
    }

    .header-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: #7b8087;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .description {
      margin: 10px 0 0;
      color: #777c83;
      font-size: 14px;
      line-height: 1.7;
    }


    /* --------------------
       Main
    -------------------- */

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }


    /* --------------------
       Card
    -------------------- */

    .video-card {
      background: #ffffff;
      border: 1px solid #e7e8ea;
      border-radius: 14px;
      padding: 18px;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .video-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .video-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
    }

    .video-note {
      margin: 0 0 16px;
      color: #777c83;
      font-size: 13px;
      line-height: 1.7;
    }

    .video-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 9px 13px;

      border-radius: 8px;
      background: #17191c;
      color: #ffffff;

      font-size: 12px;
      font-weight: 700;
      text-decoration: none;

      transition: background 0.15s ease;
    }

    .video-link:hover {
      background: #33373c;
    }

    .play-icon {
      font-size: 10px;
    }


    /* --------------------
       Empty
    -------------------- */

    .empty {
      padding: 50px 20px;
      color: #999da3;
      text-align: center;
      font-size: 13px;
    }


    /* --------------------
       Footer
    -------------------- */

    footer {
      padding: 30px 20px 40px;
      color: #a0a4aa;
      text-align: center;
      font-size: 11px;
    }


    /* --------------------
       Mobile
    -------------------- */

    @media (max-width: 600px) {

      header {
        padding: 34px 18px 24px;
      }

      h1 {
        font-size: 24px;
      }

      main {
        padding: 18px 12px 50px;
      }

      .video-card {
        padding: 16px;
        border-radius: 12px;
      }

      .video-title {
        font-size: 15px;
      }

      .video-link {
        width: 100%;
        justify-content: center;
        padding: 11px;
      }
    }
  </style>
</head>


<body>

  <header>
    <div class="header-inner">

      <div class="eyebrow">
        FOOTBALL VIDEO ARCHIVE
      </div>

      <h1>
        Match Videos
      </h1>

      <p class="description">
        サッカーの試合動画をまとめています。
      </p>

    </div>
  </header>


  <main>

    <div class="video-list" id="videoList">
      <!-- JavaScriptでここに表示されます -->
    </div>

  </main>


  <footer>
    Football Video Archive
  </footer>


  <script>

    /*
     * ==============================
     * 動画リスト
     * ==============================
     *
     * title : タイトル
     * url   : YouTubeのURL
     * note  : メモ
     *
     */

    const videos = [

      {
        title: "Manchester City vs Arsenal",
        url: "https://www.youtube.com/watch?v=xxxxxxxxxxx",
        note: "2026/09/15 Premier League"
      },

      {
        title: "Barcelona vs Real Madrid",
        url: "https://www.youtube.com/watch?v=yyyyyyyyyyy",
        note: "El Clásico / Full Match"
      },

      {
        title: "日本代表 vs 韓国代表",
        url: "https://www.youtube.com/watch?v=zzzzzzzzzzz",
        note: "国際親善試合"
      }

    ];


    /*
     * ==============================
     * 表示
     * ==============================
     */

    const videoList = document.getElementById("videoList");

    if (videos.length === 0) {

      videoList.innerHTML = `
        <div class="empty">
          動画はまだありません。
        </div>
      `;

    } else {

      videos.forEach(video => {

        const card = document.createElement("article");

        card.className = "video-card";

        card.innerHTML = `
          <h2 class="video-title">
            ${escapeHTML(video.title)}
          </h2>

          <p class="video-note">
            ${escapeHTML(video.note)}
          </p>

          <a
            class="video-link"
            href="${video.url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="play-icon">▶</span>
            YouTubeで見る
          </a>
        `;

        videoList.appendChild(card);

      });

    }


    /*
     * HTMLエスケープ
     */

    function escapeHTML(str) {

      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
